name: Build Revenge USB Audio Route v4

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/revenge-usb-audio-route-v4 ]
    paths:
      - 'discord-usb-route-revenge-v4/**'
      - '.github/workflows/build-revenge-usb-audio-route-v4.yml'
  pull_request:
    paths:
      - 'discord-usb-route-revenge-v4/**'
      - '.github/workflows/build-revenge-usb-audio-route-v4.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: discord-usb-route-revenge-v4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.29

      - name: Install dependencies
        run: bun install

      - name: Build plugin
        run: bun run build

      - name: Upload plugin files
        uses: actions/upload-artifact@v4
        with:
          name: Revenge-UsbAudioRoute-v4
          path: discord-usb-route-revenge-v4/dist/UsbAudioRouteV4
          if-no-files-found: error
