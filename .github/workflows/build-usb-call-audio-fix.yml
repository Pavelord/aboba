name: Build USB Call Audio Fix APK

on:
  push:
    branches: [ main ]
    paths:
      - 'usb-call-audio-fix/**'
      - '.github/workflows/build-usb-call-audio-fix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usb-call-audio-fix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UsbCallAudioFix-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsbCallAudioFix-debug
          path: usb-call-audio-fix/UsbCallAudioFix-debug.apk
