name: Build Discord USB Route Aliucord Plugin

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'discord-usb-route-aliucord/**'
      - '.github/workflows/build-discord-usb-route-aliucord.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone current Aliucord plugin template
        run: git clone --depth 1 https://github.com/Aliucord/plugins-template.git aliucord-template

      - name: Add USB routing plugin to template
        run: |
          rm -rf aliucord-template/plugins/MyFirstKotlinPlugin
          rm -rf aliucord-template/plugins/MyFirstJavaPlugin
          mkdir -p aliucord-template/plugins/UsbCallAudioRoute/src/main/kotlin/ru/pavelord/usbcallaudioroute
          cp discord-usb-route-aliucord/build.gradle.kts aliucord-template/plugins/UsbCallAudioRoute/build.gradle.kts
          cp discord-usb-route-aliucord/UsbCallAudioRoute.kt \
            aliucord-template/plugins/UsbCallAudioRoute/src/main/kotlin/ru/pavelord/usbcallaudioroute/UsbCallAudioRoute.kt

      - name: Build plugin
        working-directory: aliucord-template
        run: |
          chmod +x ./gradlew
          ./gradlew make --stacktrace

      - name: Collect plugin ZIP
        run: |
          mkdir -p artifacts
          find aliucord-template/plugins/UsbCallAudioRoute -type f -name '*.zip' -print -exec cp {} artifacts/UsbCallAudioRoute.zip \;
          test -f artifacts/UsbCallAudioRoute.zip

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: UsbCallAudioRoute-Aliucord
          path: artifacts/UsbCallAudioRoute.zip
          if-no-files-found: error
